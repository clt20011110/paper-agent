schema_version: "1"
provider: gemini_search
distribution: google-genai
version: unresolved
entry_point: gemini_search_plugin:GeminiSearchProvider
artifact_sha256: null
enabled: false
builtin: false
authority: discovery_enhancement
roles: [search]
capabilities: [stable_id, metadata, abstract]
authentication: {required: true, credential_env: GEMINI_API_KEY}
rate_limit: {global_qps: 1, max_concurrency: 1, cache_ttl_seconds: 3600}
terms: {data_use: restricted, url: https://ai.google.dev/gemini-api/terms}
independence_group: gemini
upstream_families: [gemini]
