[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent"
version = "2.0.0a0"
description = "Stage 1 venue-year metadata collection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-socket>=0.7,<1",
]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_agent = ["venue_specs/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
markers = [
    "live_smoke: manual network smoke test; requires PAPER_AGENT_RUN_LIVE_SMOKE=1",
]
