[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent"
version = "2.0.0a0"
description = "Recoverable and auditable literature research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
    "pypdf>=6,<7",
    "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-socket>=0.7,<1",
]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_agent = ["storage/migrations/*.sql"]

[tool.setuptools.data-files]
"share/paper-agent/schemas" = ["schemas/*.json"]
"share/paper-agent/providers" = ["providers/*.yaml"]
"share/paper-agent/venues" = ["venues/*.yaml"]
"share/paper-agent/acceptance" = ["acceptance/*.yaml"]
"share/paper-agent/policies" = ["policies/*.yaml"]
"share/paper-agent/tests/fixtures/providers" = ["tests/fixtures/providers/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
markers = [
    "live_smoke: manual network smoke test; requires PAPER_AGENT_RUN_LIVE_SMOKE=1",
]
