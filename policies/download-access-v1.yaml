schema_version: "1"
policy_version: download-access-v1

purposes:
  - personal_research
  - internal_analysis
  - redistribution

publication_versions:
  - preprint
  - accepted_manuscript
  - published
  - unknown

# These bases never imply permission to save a copy. A valid download+store
# grant may authorize personal or internal use, subject to machine-readable
# provider terms. Redistribution still requires an explicit compatible license.
restricted_access_bases:
  - public_read_only
  - user_subscription
  - user_supplied
  - unknown

states:
  allow: allow
  needs_grant: needs_grant
  manual: manual
  deny: deny

license_aliases:
  "cc0": cc0-1.0
  "cc0-1.0": cc0-1.0
  "https://creativecommons.org/publicdomain/zero/1.0": cc0-1.0
  "cc-by": cc-by
  "cc-by-4.0": cc-by-4.0
  "https://creativecommons.org/licenses/by/4.0": cc-by-4.0
  "cc-by-sa": cc-by-sa
  "cc-by-sa-4.0": cc-by-sa-4.0
  "https://creativecommons.org/licenses/by-sa/4.0": cc-by-sa-4.0
  "cc-by-nc": cc-by-nc
  "cc-by-nc-4.0": cc-by-nc-4.0
  "https://creativecommons.org/licenses/by-nc/4.0": cc-by-nc-4.0
  "cc-by-nc-sa": cc-by-nc-sa
  "cc-by-nc-sa-4.0": cc-by-nc-sa-4.0
  "https://creativecommons.org/licenses/by-nc-sa/4.0": cc-by-nc-sa-4.0
  "public-domain": public-domain

compatible_licenses:
  personal_research:
    - cc0-1.0
    - cc-by
    - cc-by-4.0
    - cc-by-sa
    - cc-by-sa-4.0
    - cc-by-nc
    - cc-by-nc-4.0
    - cc-by-nc-sa
    - cc-by-nc-sa-4.0
    - public-domain
  internal_analysis:
    - cc0-1.0
    - cc-by
    - cc-by-4.0
    - cc-by-sa
    - cc-by-sa-4.0
    - cc-by-nc
    - cc-by-nc-4.0
    - cc-by-nc-sa
    - cc-by-nc-sa-4.0
    - public-domain
  redistribution:
    - cc0-1.0
    - cc-by
    - cc-by-4.0
    - cc-by-sa
    - cc-by-sa-4.0
    - public-domain

fetch_limits:
  request_ttl_seconds: 900
  min_pdf_bytes: 100
  max_pdf_bytes: 209715200
