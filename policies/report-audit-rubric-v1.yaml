version: 1
name: stage4b-report-audit
required_categories:
  - unsupported_claim
  - miscited_claim
  - coverage_gap
  - conflict_erasure
  - incomparable_value
  - overgeneralization
  - search_limitation
  - plan_deviation
severity:
  complete_requires_zero: [blocker, major]
coverage:
  mode: exhaustive
  units: [substantive_block, claim, evidence_ref]
rules:
  - all substantive blocks bind claims and canonical paper citations
  - every citation maps to verified canonical metadata
  - table cells retain claim and evidence provenance
  - search and extraction limitations are disclosed
  - numbers require corpus or paper evidence provenance
