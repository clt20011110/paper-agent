name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Bootstrap locked test environment
        run: uv sync --locked --extra dev
      - name: Run tests with external network disabled
        run: uv run --no-sync pytest --disable-socket --allow-unix-socket --allow-hosts=localhost,127.0.0.1,::1

  offline-workflow-contract:
    name: Offline workflow and skill contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Bootstrap locked test environment
        run: uv sync --locked --extra dev
      - name: Run fixture workflow and command contract without external network
        run: >-
          uv run --no-sync pytest --disable-socket --allow-unix-socket
          --allow-hosts=localhost,127.0.0.1,::1
          tests/test_search_cli.py tests/test_cli_foundations.py
          tests/test_workflow.py tests/test_phase7_productization.py

  wheel-install:
    name: Build and verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Bootstrap and cache locked dependencies
        run: uv sync --locked --extra dev
      - name: Build wheel
        run: uv build --wheel
      - name: Bootstrap locked runtime dependencies in an isolated environment
        run: |
          uv venv "${{ runner.temp }}/paper-agent-wheel"
          uv export --locked --no-dev --no-emit-project --output-file "${{ runner.temp }}/runtime-requirements.txt"
          uv pip install --python "${{ runner.temp }}/paper-agent-wheel/bin/python" --requirements "${{ runner.temp }}/runtime-requirements.txt"
      - name: Install the built project wheel offline
        run: >-
          uv pip install --offline --no-deps
          --python "${{ runner.temp }}/paper-agent-wheel/bin/python" dist/*.whl
      - name: Verify installed runtime outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p wheel-verification
          cd wheel-verification
          "${{ runner.temp }}/paper-agent-wheel/bin/paper-agent" --version
          "${{ runner.temp }}/paper-agent-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_wheel_install.py"
